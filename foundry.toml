[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.30"
# Paris = no PUSH0/MCOPY -> bytecode runs on every chain involved
# (Reactive Lasna, Unichain Sepolia, Base Sepolia) without EVM-version surprises.
evm_version = "paris"
optimizer = true
optimizer_runs = 200
via_ir = true
fs_permissions = [{ access = "read-write", path = "./deployments" }]

[fmt]
line_length = 110
tab_width = 4
bracket_spacing = true
